worker_processes auto;

events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name _;

        root /var/www;
        index index.html;

        add_header Access-Control-Allow-Origin https://jetkvm.tenasi.net,https://api.jetkvm.tenasi.net;

        location /assets/ {
            try_files $uri $uri/;
        }
        location / {
            try_files $uri /index.html;
        }
    }
}
